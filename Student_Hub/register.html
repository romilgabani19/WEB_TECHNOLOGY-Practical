<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Register</title>
    <link rel="stylesheet" href="style.css">

        <script>

            function validateForm() {

                let name = document.getElementById("name").value;
                let email = document.getElementById("email").value;
                let password = document.getElementById("password").value;
                let confirmPassword = document.getElementById("confirm").value;
                let phone = document.getElementById("phone").value;
                let enrollment = document.getElementById("enrollment").value;

                let enrollmentpattern = /^[0-9]{2}aiml[0-9]{3}$/;

                if (name === "") {
                    alert("Please enter your full name!");
                    return false;
                }

                if (email === "") {
                    alert("Please enter your email address!");
                    return false;
                }

                let passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[@$!%*?&])(?=.*[0-9]){8,}$/;

                if (!passwordPattern.test(password)) {
                    alert("Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one special character, and one digit.");
                    return false;
                }

                 if (password !== confirmPassword) {
                    alert("Passwords do not match!");
                    return false;
                }

                if (phone.length !== 10 || isNaN(phone)) {
                    alert("Please enter a valid 10-digit mobile number.");
                    return false;
                }

                alert("Registration successful!");
                return true;
            }
   

    </script>

</head>

<body>

    <header>
        <div class="logo">
            <h1>StudentHub</h1>
        </div>

        <nav>
            <ul>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="register.html" class="active">Register</a>
                <a href="login.html">Login</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="events.html">Events</a>
                <a href="profile.html">Profile</a>
                <a href="contact.html">Contact</a>
                <a href="admin.html">Admin</a>
                <a href="faq.html">FAQ</a>
                <a href="feedback.html">Feedback</a>
            </ul>
        </nav>
    </header>

    <main>

        <section class="form-section">

            <h2>Student Registration</h2>

            <form action="login.html" method="get">

                <br>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </br>

                <br>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </br>

                <br>
                    <label for="phone">Mobile Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your mobile number" required>
                </br>

                <br>
                    <label for="college">College Name</label>
                    <input type="text" id="college" name="college" placeholder="Enter your college name" required>
                </br>

                <br>
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option>CSE</option>
                        <option>AI&ML</option>
                        <option>IT</option>
                        <option>CE</option>
                        <option>ME</option>
                        <option>CIVIL</option>
                    </select>
                </br>

                <br>
                    <label for="enrollment">Enrollment Number</label>
                    <input type="text" id="enrollment" name="enrollment" placeholder="Enter your enrollment number" required>
                </br>

                <br>
                    <label for="semester">Semester</label>
                    <select id="semester" name="semester" required>
                        <option value="">Select Semester</option>
                        <option>Semester 1</option>
                        <option>Semester 2</option>
                        <option>Semester 3</option>
                        <option>Semester 4</option>
                        <option>Semester 5</option>
                        <option>Semester 6</option>
                        <option>Semester 7</option>
                        <option>Semester 8</option>
                    </select>
                </br>

                <br>
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male" required>
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>
                </br>

                <br>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </br>   

                <br>
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Confirm password" required>
                </br>

                <br>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" required>
                            I agree to the Terms and Conditions
                        </label>
                    </div>
                </br>

                <br>
                    <button type="submit" class="btn">
                        Register
                    </button>
                    <button type="clear" class="btn">
                        Clear
                    </button>
                </br>


            </form>

        </section>

    </main>
    
</body>
</html>
