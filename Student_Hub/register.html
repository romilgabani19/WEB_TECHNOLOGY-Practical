<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Register</title>
    <link rel="stylesheet" href="style.css">

    <script>
        function validateForm() {

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let college = document.getElementById("college").value.trim();
            let course = document.getElementById("course").value;
            let enrollment = document.getElementById("enrollment").value.trim().toLowerCase();
            let semester = document.getElementById("semester").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirm").value;

            if (name === "") {
                alert("Please enter your full name!");
                return false;
            }

            if (email === "") {
                alert("Please enter your email address!");
                return false;
            }

            if (phone.length !== 10 || isNaN(phone)) {
                alert("Please enter a valid 10-digit mobile number.");
                return false;
            }

            if (college === "") {
                alert("Please enter your college name!");
                return false;
            }

            if (course === "") {
                alert("Please select your course!");
                return false;
            }

            let enrollmentPattern = /^[0-9]{2}aiml[0-9]{3}$/i;

            if (!enrollmentPattern.test(enrollment)) {
                alert("Please enter a valid enrollment number.");
                return false;
            }

            if (semester === "") {
                alert("Please select your semester!");
                return false;
            }

            let passwordPattern =
                /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@$!%*?&]).{8,}$/;

            if (!passwordPattern.test(password)) {
                alert(
                    "Password must be at least 8 characters long and contain " +
                    "one uppercase letter, one lowercase letter, one digit, " +
                    "and one special character."
                );
                return false;
            }

            // Confirm password
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return false;
            }

            // Gender validation
            let gender = document.querySelector(
                'input[name="gender"]:checked'
            );

            if (!gender) {
                alert("Please select your gender!");
                return false;
            }

            // Hobbies validation
            let hobbies = document.querySelectorAll(
                'input[name="hobbies"]:checked'
            );

            if (hobbies.length === 0) {
                alert("Please select at least one hobby!");
                return false;
            }

            // Terms validation
            let terms = document.querySelector(
                'input[name="terms"]:checked'
            );

            if (!terms) {
                alert("Please agree to the Terms and Conditions!");
                return false;
            }

            alert("Registration successful!");

            return true;
        }
    </script>
</head>

<body>

    <header>
        <div class="logo">
            <h1>StudentHub</h1>
        </div>

        <nav>
            <ul>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="register.html" class="active">Register</a>
                <a href="login.html">Login</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="events.html">Events</a>
                <a href="profile.html">Profile</a>
                <a href="contact.html">Contact</a>
                <a href="admin.html">Admin</a>
                <a href="faq.html">FAQ</a>
                <a href="feedback.html">Feedback</a>
            </ul>
        </nav>
    </header>

    <main>

        <section class="form-section">

            <h2>Student Registration</h2>

            <form action="login.html" method="get"
                  onsubmit="return validateForm()">

                <br>
                <label for="name">Full Name</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name">
                </br>

                <br>
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email">
                </br>

                <br>
                <label for="phone">Mobile Number</label>
                <input type="tel"
                       id="phone"
                       name="phone"
                       placeholder="Enter your mobile number">
                </br>

                <br>
                <label for="college">College Name</label>
                <input type="text"
                       id="college"
                       name="college"
                       placeholder="Enter your college name">
                </br>

                <br>
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value="">Select Course</option>
                    <option value="CSE">CSE</option>
                    <option value="AI&ML">AI&ML</option>
                    <option value="IT">IT</option>
                    <option value="CE">CE</option>
                    <option value="ME">ME</option>
                    <option value="CIVIL">CIVIL</option>
                </select>
                </br>

                <br>
                <label for="enrollment">Enrollment Number</label>
                <input type="text"
                       id="enrollment"
                       name="enrollment"
                       placeholder="Enter your enrollment number">
                </br>

                <br>
                <label for="semester">Semester</label>
                <select id="semester" name="semester">
                    <option value="">Select Semester</option>
                    <option value="Semester 1">Semester 1</option>
                    <option value="Semester 2">Semester 2</option>
                    <option value="Semester 3">Semester 3</option>
                    <option value="Semester 4">Semester 4</option>
                    <option value="Semester 5">Semester 5</option>
                    <option value="Semester 6">Semester 6</option>
                    <option value="Semester 7">Semester 7</option>
                    <option value="Semester 8">Semester 8</option>
                </select>
                </br>

                <br>
                <label>Gender</label>

                <div class="radio-group">

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Other">
                        Other
                    </label>

                </div>
                </br>

                <br>
                <label>Hobbies</label>

                <div class="checkbox-group">

                    <label>
                        <input type="checkbox"
                               name="hobbies"
                               value="Reading">
                        Reading
                    </label>

                    <label>
                        <input type="checkbox"
                               name="hobbies"
                               value="Sports">
                        Sports
                    </label>

                    <label>
                        <input type="checkbox"
                               name="hobbies"
                               value="Music">
                        Music
                    </label>

                </div>
                </br>

                <br>
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Create a password">
                </br>

                <br>
                <label for="confirm">Confirm Password</label>
                <input type="password"
                       id="confirm"
                       name="confirm"
                       placeholder="Confirm password">
                </br>

                <br>
                <div class="checkbox-group">

                    <label>
                        <input type="checkbox"
                               name="terms">
                        I agree to the Terms and Conditions
                    </label>

                </div>
                </br>

                <br>

                <button type="submit" class="btn">
                    Register
                </button>

                <button type="reset" class="btn">
                    Clear
                </button>

                </br>

            </form>

        </section>

    </main>

</body>
</html>
